name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm check
          pnpm test

      - name: Build APK on EAS
        run: |
          for attempt in 1 2 3; do
            echo "EAS build attempt ${attempt}/3"
            if pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "EAS unavailable or busy; retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit 1

      - name: Build summary
        if: always()
        run: |
          echo "If the build was submitted, open the Expo dashboard to monitor progress and download the APK artifact."
          echo "Project: sitio-gestao"
          echo "Profile: preview"
